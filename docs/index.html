<!DOCTYPE html>
<html>
<head>
    <title>TikTok Auto-Poster - Login</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; color: #fff; }
        .container { text-align: center; max-width: 400px; padding: 40px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; }
        .btn { background: #fe2c55; color: #fff; padding: 14px 40px; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #ff4477; }
        .note { color: #666; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Auto-Poster</h1>
        <p>Connect your TikTok account to start auto-posting</p>
        <a class="btn" id="loginBtn">Login with TikTok</a>
        <p class="note">This will redirect you to TikTok for authorization.<br>After approving, you'll see a code to copy.</p>
    </div>
    <script>
        const CLIENT_KEY = 'sbaw3n9tzfkzntu7xp';
        const REDIRECT = encodeURIComponent(window.location.origin + window.location.pathname.replace('index.html','').replace(/\/$/, '/') + 'callback.html');
        const SCOPES = 'user.info.basic,video.upload,video.publish';
        const STATE = Math.random().toString(36).substring(2, 15);
        document.getElementById('loginBtn').href =
            `https://www.tiktok.com/v2/auth/authorize/?client_key=${CLIENT_KEY}&scope=${SCOPES}&response_type=code&redirect_uri=${REDIRECT}&state=${STATE}`;
    </script>
</body>
</html>
