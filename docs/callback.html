<!DOCTYPE html>
<html>
<head>
    <title>TikTok Auth - Copy This Code</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; color: #fff; }
        .container { text-align: center; max-width: 500px; padding: 40px; }
        h1 { font-size: 22px; margin-bottom: 20px; }
        .code-box { background: #1a1a1a; border: 2px solid #fe2c55; border-radius: 8px; padding: 20px; font-family: monospace; font-size: 18px; word-break: break-all; cursor: pointer; margin: 20px 0; user-select: all; }
        .code-box:hover { background: #222; }
        .label { color: #aaa; font-size: 14px; margin-bottom: 8px; }
        .btn { background: #fe2c55; color: #fff; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #ff4477; }
        .ok { color: #2ecc71; font-size: 18px; margin-bottom: 10px; }
        .err { color: #e74c3c; font-size: 18px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="success" style="display:none">
            <div class="ok">Authorization Successful!</div>
            <h1>Copy this code:</h1>
            <div class="label">Click the box to select, then Ctrl+C</div>
            <div class="code-box" id="codeBox" onclick="this.select()"></div>
            <button class="btn" onclick="copyCode()">Copy to Clipboard</button>
            <p style="color:#666; font-size:13px; margin-top:20px;">Send this code to complete setup</p>
        </div>
        <div id="error" style="display:none">
            <div class="err">Authorization Failed</div>
            <p id="errorMsg"></p>
            <a href="index.html" style="color:#fe2c55;">Try Again</a>
        </div>
        <div id="loading">Processing...</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        document.getElementById('loading').style.display = 'none';
        if (code) {
            document.getElementById('success').style.display = 'block';
            document.getElementById('codeBox').textContent = code;
        } else {
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMsg').textContent = error || 'No authorization code received';
        }
        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('codeBox').textContent);
            document.querySelector('.btn').textContent = 'Copied!';
            setTimeout(() => document.querySelector('.btn').textContent = 'Copy to Clipboard', 2000);
        }
    </script>
</body>
</html>
